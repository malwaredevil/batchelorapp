version: 2
updates:
  - package-ecosystem: "npm"
    # The root pnpm workspace and shared lockfile cover all workspace packages.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    rebase-strategy: "auto"
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    rebase-strategy: "auto"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
        update-types:
          - "minor"
          - "patch"
