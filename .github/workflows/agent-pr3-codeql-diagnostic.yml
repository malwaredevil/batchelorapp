name: Agent PR3 CodeQL diagnostic

on:
  push:
    branches:
      - agent/platform-security-and-readiness
    paths:
      - .github/workflows/agent-pr3-codeql-diagnostic.yml

permissions:
  contents: write
  checks: read
  security-events: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/platform-security-and-readiness
          fetch-depth: 0

      - name: Read CodeQL check and annotations
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: '90549060948'
        run: |
          set -euo pipefail
          mkdir -p docs/review-remediation
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" > /tmp/check-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}/annotations" > /tmp/annotations.json
          {
            echo '# PR 3 CodeQL diagnostic'
            echo
            echo 'Exact check-run metadata and annotations captured from GitHub.'
            echo
            echo '## Check summary'
            echo
            jq -r '"- name: " + (.name // "unknown"), "- status: " + (.status // "unknown"), "- conclusion: " + (.conclusion // "unknown"), "- details: " + (.details_url // "unknown"), "- title: " + (.output.title // ""), "- summary: " + ((.output.summary // "") | gsub("\\r?\\n"; " "))' /tmp/check-run.json
            echo
            echo '## Annotations'
            echo
            jq -r 'if length == 0 then "- No annotations returned." else .[] | "- level=" + (.annotation_level // "") + " path=" + (.path // "") + " lines=" + ((.start_line // 0)|tostring) + "-" + ((.end_line // 0)|tostring) + " title=" + (.title // "") + " message=" + ((.message // "") | gsub("\\r?\\n"; " ")) + " details=" + (.details_url // "") end' /tmp/annotations.json
          } > docs/review-remediation/pr3-codeql-diagnostic.md

      - name: Remove workflow and commit diagnostic
        run: |
          set -euo pipefail
          rm .github/workflows/agent-pr3-codeql-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent-pr3-codeql-diagnostic.yml docs/review-remediation/pr3-codeql-diagnostic.md
          git commit -m 'chore: record PR 3 CodeQL diagnostic [skip ci]'
          git push origin HEAD:agent/platform-security-and-readiness
