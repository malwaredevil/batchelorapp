name: Agent PR3 CodeQL fix

on:
  push:
    branches:
      - agent/platform-security-and-readiness
    paths:
      - .github/workflows/agent-pr3-codeql-fix.yml
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/agent-pr3-codeql-fix.yml

permissions:
  contents: write

concurrency:
  group: agent-pr3-codeql-fix
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/platform-security-and-readiness
          fetch-depth: 0

      - name: Patch API limiter mount and invariant test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('artifacts/api-server/src/app.ts')
          app = app_path.read_text()
          import_anchor = 'import { uploadSizeGuard } from "./middleware/uploadSizeGuard";\n'
          import_line = 'import { apiLimiter } from "./middleware/rateLimit";\n'
          if import_line not in app:
              if import_anchor not in app:
                  raise SystemExit('app import anchor not found')
              app = app.replace(import_anchor, import_anchor + import_line, 1)

          mount_anchor = '  next();\n});\napp.use("/api", router);'
          mount_replacement = '  next();\n});\napp.use("/api", apiLimiter);\napp.use("/api", router);'
          if 'app.use("/api", apiLimiter);' not in app:
              if mount_anchor not in app:
                  raise SystemExit('app limiter mount anchor not found')
              app = app.replace(mount_anchor, mount_replacement, 1)
          app_path.write_text(app)

          test_path = Path('artifacts/api-server/src/middleware/platform-security.test.ts')
          test = test_path.read_text()
          test_block = '''\n  it("mounts a fail-closed API limiter before the router", () => {\n    const app = source("../app.ts");\n    const limiter = source("./rateLimit.ts");\n    expect(app.indexOf('app.use("/api", apiLimiter)')).toBeGreaterThan(-1);\n    expect(app.indexOf('app.use("/api", apiLimiter)')).toBeLessThan(\n      app.indexOf('app.use("/api", router)'),\n    );\n    expect(limiter).toContain('new PostgresRateLimitStore("api")');\n    expect(limiter).toContain("passOnStoreError: false");\n  });\n'''
          if 'mounts a fail-closed API limiter before the router' not in test:
              closing = '\n});\n'
              if not test.endswith(closing):
                  raise SystemExit('test closing anchor not found')
              test = test[:-len(closing)] + test_block + closing
          test_path.write_text(test)

          report_path = Path('docs/review-remediation/pr3-codeql-diagnostic.md')
          report = report_path.read_text()
          remediation = '''\n## Remediation\n\n- Added a PostgreSQL-backed, fail-closed API safety-net limiter.\n- Mounted it after startup readiness and before the API router.\n- Preserved stricter endpoint-specific limiters and skipped health probes.\n- Added a source invariant test for middleware ordering and store policy.\n'''
          if '## Remediation' not in report:
              report_path.write_text(report.rstrip() + '\n' + remediation)
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Validate fix
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/middleware/rateLimit.ts \
            artifacts/api-server/src/middleware/platform-security.test.ts \
            docs/review-remediation/pr3-codeql-diagnostic.md
          pnpm run typecheck
          pnpm --filter @workspace/api-server run test

      - name: Remove workflow and commit validated fix
        run: |
          set -euo pipefail
          rm .github/workflows/agent-pr3-codeql-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/agent-pr3-codeql-fix.yml \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/middleware/rateLimit.ts \
            artifacts/api-server/src/middleware/platform-security.test.ts \
            docs/review-remediation/pr3-codeql-diagnostic.md
          git commit -m 'fix: enforce fail-closed API rate limiting'
          git push origin HEAD:agent/platform-security-and-readiness
