name: Agent PR2 remediation

on:
  push:
    branches:
      - agent/job-and-webhook-reliability

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-remediation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/job-and-webhook-reliability
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply remediation
        id: apply
        shell: bash
        run: |
          set +e
          python .github/agent-remediation/pr2_apply.py > /tmp/apply.log 2>&1
          status=$?
          cat /tmp/apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log .github/agent-remediation/pr2-failure.log
          fi
          exit 0
      - name: Commit diagnostic if patch failed
        if: steps.apply.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/agent-remediation/pr2-failure.log
          git commit -m "chore: capture PR2 remediation failure [skip-remediation]"
          git push origin HEAD:agent/job-and-webhook-reliability
      - name: Remove one-shot automation
        if: steps.apply.outputs.status == '0'
        run: rm .github/agent-remediation/pr2_apply.py .github/workflows/agent-remediation-pr2.yml
      - name: Install dependencies
        if: steps.apply.outputs.status == '0'
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        if: steps.apply.outputs.status == '0'
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/lib/jobs/worker.ts \
            artifacts/api-server/src/lib/jobs/worker.test.ts \
            artifacts/api-server/src/lib/jobs/queue.ts \
            artifacts/api-server/src/routes/slack.ts \
            artifacts/api-server/src/routes/slack-reliability.test.ts \
            lib/db/src/schema/slack.ts \
            lib/db/src/schema-statements.ts
      - name: Validate and record results
        if: steps.apply.outputs.status == '0'
        shell: bash
        run: |
          set +e
          mkdir -p docs/review-remediation
          {
            echo '# PR 2 validation'
            echo
            echo 'Generated by the one-shot implementation workflow.'
            echo
            echo '## Typecheck'
            echo '```text'
            pnpm run typecheck
            typecheck_status=$?
            echo '```'
            echo
            echo "Exit code: $typecheck_status"
            echo
            echo '## API tests'
            echo '```text'
            pnpm --filter @workspace/api-server run test
            test_status=$?
            echo '```'
            echo
            echo "Exit code: $test_status"
          } > docs/review-remediation/pr2-validation.md 2>&1
          cat docs/review-remediation/pr2-validation.md
          exit 0
      - name: Commit implementation
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix job and webhook reliability [skip-remediation]"
          git push origin HEAD:agent/job-and-webhook-reliability
