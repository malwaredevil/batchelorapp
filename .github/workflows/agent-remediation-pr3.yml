name: Agent PR3 remediation

on:
  push:
    branches:
      - agent/platform-security-and-readiness

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/platform-security-and-readiness
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: python .github/agent-remediation/pr3_apply.py
      - run: rm .github/agent-remediation/pr3_apply.py .github/workflows/agent-remediation-pr3.yml
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/lib/auth-context.ts \
            artifacts/api-server/src/lib/startup-state.ts \
            artifacts/api-server/src/lib/startup-readiness.test.ts \
            artifacts/api-server/src/lib/startup-migrate.ts \
            artifacts/api-server/src/middleware/auth.ts \
            artifacts/api-server/src/middleware/owner.ts \
            artifacts/api-server/src/middleware/csrf.ts \
            artifacts/api-server/src/middleware/platform-security.test.ts \
            artifacts/api-server/src/routes/auth.ts \
            artifacts/api-server/src/routes/health.ts \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/index.ts
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run test
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix platform security and startup readiness"
          git push origin HEAD:agent/platform-security-and-readiness
