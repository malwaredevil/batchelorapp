name: Agent PR3 remediation

on:
  push:
    branches:
      - agent/platform-security-and-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/platform-security-and-readiness
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply remediation
        id: apply
        shell: bash
        run: |
          set +e
          python .github/agent-remediation/pr3_apply.py > /tmp/apply.log 2>&1
          status=$?
          cat /tmp/apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log .github/agent-remediation/pr3-failure.log
          fi
          exit 0
      - name: Commit diagnostic if patch failed
        if: steps.apply.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/agent-remediation/pr3-failure.log
          git commit -m "chore: capture PR3 remediation failure [skip-remediation]"
          git push origin HEAD:agent/platform-security-and-readiness
      - name: Remove one-shot automation
        if: steps.apply.outputs.status == '0'
        run: |
          rm .github/agent-remediation/pr3_apply.py .github/workflows/agent-remediation-pr3.yml
          rm -f .github/agent-remediation/trigger-pr3.txt
      - name: Install dependencies
        if: steps.apply.outputs.status == '0'
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        if: steps.apply.outputs.status == '0'
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/lib/auth-context.ts \
            artifacts/api-server/src/lib/startup-state.ts \
            artifacts/api-server/src/lib/startup-readiness.test.ts \
            artifacts/api-server/src/lib/startup-migrate.ts \
            artifacts/api-server/src/middleware/auth.ts \
            artifacts/api-server/src/middleware/owner.ts \
            artifacts/api-server/src/middleware/csrf.ts \
            artifacts/api-server/src/middleware/platform-security.test.ts \
            artifacts/api-server/src/routes/auth.ts \
            artifacts/api-server/src/routes/health.ts \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/index.ts
      - name: Validate and record results
        if: steps.apply.outputs.status == '0'
        shell: bash
        run: |
          set +e
          pnpm run typecheck | tee /tmp/pr3-typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          pnpm --filter @workspace/api-server run test | tee /tmp/pr3-tests.log
          test_status=${PIPESTATUS[0]}
          mkdir -p docs/review-remediation
          cat > docs/review-remediation/pr3-validation.md <<EOF
          # PR 3 validation

          Validation was executed by the one-shot implementation workflow.

          | Check | Exit code |
          | --- | ---: |
          | \`pnpm run typecheck\` | ${typecheck_status} |
          | \`pnpm --filter @workspace/api-server run test\` | ${test_status} |

          Normal pull-request CI remains authoritative after this branch is rebased in programme order.
          EOF
          pnpm exec prettier --write docs/review-remediation/pr3-validation.md
          exit 0
      - name: Commit implementation
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix platform security and startup readiness [skip-remediation]"
          git push origin HEAD:agent/platform-security-and-readiness
