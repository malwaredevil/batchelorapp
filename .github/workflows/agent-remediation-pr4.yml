name: Agent PR4 remediation

on:
  push:
    branches:
      - agent/shared-core-and-collection-quality

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-remediation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/shared-core-and-collection-quality
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply remediation
        id: apply
        shell: bash
        run: |
          set +e
          python .github/agent-remediation/pr4_apply.py > /tmp/apply.log 2>&1
          status=$?
          cat /tmp/apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log .github/agent-remediation/pr4-failure.log
          fi
          exit 0
      - name: Commit diagnostic if patch failed
        if: steps.apply.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/agent-remediation/pr4-failure.log
          git commit -m "chore: capture PR4 remediation failure [skip-remediation]"
          git push origin HEAD:agent/shared-core-and-collection-quality
      - name: Remove one-shot automation
        if: steps.apply.outputs.status == '0'
        run: rm .github/agent-remediation/pr4_apply.py .github/workflows/agent-remediation-pr4.yml
      - name: Install dependencies and update lockfile
        if: steps.apply.outputs.status == '0'
        run: pnpm install --no-frozen-lockfile
      - name: Regenerate API clients and documentation
        if: steps.apply.outputs.status == '0'
        run: |
          pnpm --filter @workspace/api-spec run codegen
          pnpm --filter @workspace/scripts run docs:generate
      - name: Format changed files
        if: steps.apply.outputs.status == '0'
        run: |
          pnpm exec prettier --write \
            package.json \
            scripts/package.json \
            eslint.config.mjs \
            lib/upload-validation/src/index.ts \
            artifacts/api-server/src/lib/upload-limits.ts \
            artifacts/api-server/src/middleware/uploadSizeGuard.ts \
            artifacts/api-server/src/lib/storage-core.ts \
            scripts/src/docs/generate.ts \
            scripts/src/docs/generate.test.ts \
            lib/db/src/schema/pottery.ts \
            lib/db/src/schema/quilting.ts \
            lib/db/src/schema/ornaments.ts \
            lib/db/src/schema/messenger.ts \
            lib/db/src/schema/agentphone.ts \
            lib/db/src/schema/elaine-email.ts \
            lib/db/src/schema-statements.ts \
            lib/collection-ui/src/collection-state.ts \
            lib/collection-ui/src/index.ts \
            lib/api-spec/sources/ornaments.yaml \
            artifacts/api-server/src/routes/ornaments/ornaments.ts \
            artifacts/modules/src/ornaments/pages/collection.tsx \
            artifacts/api-server/src/routes/messenger/conversations.ts \
            artifacts/api-server/src/routes/agentphone.ts \
            artifacts/api-server/src/routes/elaine-email.ts \
            artifacts/api-server/src/lib/review-remediation-quality.test.ts \
            docs/generated/*.md
      - name: Validate and record results
        if: steps.apply.outputs.status == '0'
        shell: bash
        run: |
          set +e
          mkdir -p docs/review-remediation
          report=docs/review-remediation/pr4-validation.md
          echo '# PR 4 validation' > "$report"
          echo >> "$report"
          echo 'Generated by the one-shot implementation workflow.' >> "$report"
          run_check() {
            name="$1"
            shift
            echo >> "$report"
            echo "## $name" >> "$report"
            echo '```text' >> "$report"
            "$@" >> "$report" 2>&1
            status=$?
            echo '```' >> "$report"
            echo >> "$report"
            echo "Exit code: $status" >> "$report"
          }
          run_check 'Typecheck' pnpm run typecheck
          run_check 'Semantic and formatting lint' pnpm run lint
          run_check 'API tests' pnpm --filter @workspace/api-server run test
          run_check 'Docs generator tests' pnpm --filter @workspace/scripts run docs:test
          run_check 'API server build' pnpm --filter @workspace/api-server run build
          run_check 'Modules build' pnpm --filter @workspace/modules run build
          cat "$report"
          exit 0
      - name: Commit implementation
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor shared core and collection quality [skip-remediation]"
          git push origin HEAD:agent/shared-core-and-collection-quality
