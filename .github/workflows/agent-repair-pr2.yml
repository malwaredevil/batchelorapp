name: Agent PR2 repair

on:
  push:
    branches:
      - agent/job-and-webhook-reliability

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/job-and-webhook-reliability
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: python .github/agent-remediation/pr2_repair.py
      - run: rm .github/agent-remediation/pr2_repair.py .github/workflows/agent-repair-pr2.yml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write artifacts/api-server/src/routes/slack.ts artifacts/api-server/src/routes/slack.test.ts
      - name: Validate and refresh report
        shell: bash
        run: |
          set +e
          report=docs/review-remediation/pr2-validation.md
          echo '# PR 2 validation' > "$report"
          echo >> "$report"
          echo 'Generated after the transactional Slack test repair.' >> "$report"
          run_check() {
            name="$1"
            shift
            echo >> "$report"
            echo "## $name" >> "$report"
            echo '```text' >> "$report"
            "$@" >> "$report" 2>&1
            status=$?
            echo '```' >> "$report"
            echo >> "$report"
            echo "Exit code: $status" >> "$report"
          }
          run_check 'Typecheck' pnpm run typecheck
          run_check 'API tests' pnpm --filter @workspace/api-server run test
          cat "$report"
          exit 0
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align Slack reliability mocks [skip-repair]"
          git push origin HEAD:agent/job-and-webhook-reliability
