name: Agent PR3 repair

on:
  push:
    branches:
      - agent/platform-security-and-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/platform-security-and-readiness
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Add missing Drizzle comparison import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/routes/auth.ts")
          text = path.read_text()
          old = 'import { eq, and, gt, isNull, desc, sql } from "drizzle-orm";'
          new = 'import { eq, and, gt, lt, isNull, desc, sql } from "drizzle-orm";'
          if old not in text:
              raise SystemExit("auth.ts import pattern not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/agent-repair-pr3.yml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write artifacts/api-server/src/routes/auth.ts
      - name: Validate and refresh evidence
        shell: bash
        run: |
          set +e
          pnpm run typecheck
          typecheck_status=$?
          pnpm --filter @workspace/api-server run test
          test_status=$?
          cat > docs/review-remediation/pr3-validation.md <<EOF
          # PR 3 validation

          Validation ran after the focused TypeScript repair.

          - Workspace typecheck exit code: ${typecheck_status}.
          - API-server test exit code: ${test_status}.

          Normal pull-request CI remains authoritative after rebasing this branch
          in programme order.
          EOF
          pnpm exec prettier --write docs/review-remediation/pr3-validation.md
          exit 0
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete platform security typecheck [skip-repair]"
          git push origin HEAD:agent/platform-security-and-readiness
