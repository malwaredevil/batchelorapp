name: Agent PR4 repair

on:
  push:
    branches:
      - agent/shared-core-and-collection-quality

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/shared-core-and-collection-quality
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: python .github/agent-remediation/pr4_repair.py
      - name: Remove one-shot files
        run: |
          rm .github/agent-remediation/pr4_repair.py .github/workflows/agent-repair-pr4.yml
          rm -f .github/agent-remediation/trigger-pr4.txt
      - run: pnpm install --frozen-lockfile
      - name: Format implementation and existing report
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/lib/upload-limits.ts \
            artifacts/api-server/src/lib/storage-core.ts \
            artifacts/api-server/src/middleware/uploadSizeGuard.test.ts \
            artifacts/api-server/src/lib/review-remediation-quality.test.ts \
            artifacts/api-server/src/routes/elaine-email.test.ts \
            docs/review-remediation/pr4-validation.md
      - name: Validate and refresh report
        shell: bash
        env:
          PORT: "3001"
          BASE_PATH: "/modules/"
          NODE_ENV: production
        run: |
          set +e
          mkdir -p /tmp/pr4-validation
          run_check() {
            key="$1"
            shift
            "$@" > "/tmp/pr4-validation/${key}.log" 2>&1
            echo $? > "/tmp/pr4-validation/${key}.status"
          }
          run_check typecheck pnpm run typecheck
          run_check lint pnpm run lint
          run_check api-tests pnpm --filter @workspace/api-server run test
          run_check docs-tests pnpm --filter @workspace/scripts run docs:test
          run_check api-build pnpm --filter @workspace/api-server run build
          run_check modules-build pnpm --filter @workspace/modules run build
          report=docs/review-remediation/pr4-validation.md
          {
            echo '# PR 4 validation'
            echo
            echo 'Generated after the focused validation repair.'
            for key in typecheck lint api-tests docs-tests api-build modules-build; do
              case "$key" in
                typecheck) title='Typecheck' ;;
                lint) title='Semantic and formatting lint' ;;
                api-tests) title='API tests' ;;
                docs-tests) title='Docs generator tests' ;;
                api-build) title='API server build' ;;
                modules-build) title='Modules build' ;;
              esac
              echo
              echo "## $title"
              echo '```text'
              cat "/tmp/pr4-validation/${key}.log"
              echo '```'
              echo
              echo "Exit code: $(cat /tmp/pr4-validation/${key}.status)"
            done
          } > "$report"
          pnpm exec prettier --write "$report"
          cat "$report"
          exit 0
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: repair shared-core validation [skip-repair]"
          git push origin HEAD:agent/shared-core-and-collection-quality
