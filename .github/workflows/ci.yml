name: CI

# Runs on the pull_request event only. Direct pushes to main are already
# impossible (branch protection: enforce_admins + no push access outside a
# merge), so a merge commit landing on main was never actually gated by
# anything — the checks that mattered already ran against the PR's head
# commit. A duplicate "push: branches: [main]" run added nothing but wait
# time. See .agents/memory/ci-pr-only-validation.md for the full reasoning.
#
# "ready_for_review" is included so jobs gated on `draft == false` (the
# heavier/slower suite below) fire the moment a PR leaves Draft, without
# needing a separate synchronize push.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm run typecheck

  build-api:
    name: Build API server
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/api-server run build

  build-modules:
    name: Build modules frontend
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      PORT: "3001"
      BASE_PATH: "/modules/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/modules run build

  build-web:
    name: Build web frontend
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      PORT: "3002"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/web run build

  build-elaine:
    name: Build elaine frontend
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      PORT: "3003"
      BASE_PATH: "/elaine/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/elaine run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `pnpm run lint` shells out to check-duplicate-code with
      # `--base origin/main`, which needs a real, resolvable origin/main ref
      # to diff against (see guardrails.yml, which needs the same thing for
      # its own origin/main-based checks). The default shallow checkout only
      # fetches the PR head commit, so origin/main doesn't exist locally and
      # the check fails loudly with "Cannot resolve base ref" — not a real
      # lint error. fetch-depth: "0" (full history) makes the ref resolvable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: "0"
      - uses: ./.github/actions/setup-workspace
      - run: pnpm run lint

  app-config-drift:
    name: App-config drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/api-server run lint:config

  backup-coverage-guard:
    name: Backup coverage guard
    # Ensures every pgTable() in lib/db/src/schema/*.ts is referenced in a
    # copyTable() call in both backup-to-replit.ts and restore-from-replit.ts
    # (or explicitly listed in INTENTIONAL_SKIPS).  Catches the recurring bug
    # where a new feature table is added to the Drizzle schema but the
    # hand-maintained backup/restore scripts are not updated.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/scripts run check-backup-coverage

  workflow-security:
    name: Workflow security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/scripts run check-workflow-security

  composition-guard:
    name: Composition guard
    # Runs on every PR. This job is intentionally separate from the "Lint"
    # job (which also runs the check via pnpm run lint) so that a composition
    # violation surfaces as a clearly labelled failed job in the GitHub UI
    # rather than being buried inside lint output.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run composition and configuration guard
        run: pnpm --filter @workspace/scripts run check-domain-composition

  elaine-capability-parity:
    name: Elaine capability parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Heavier check — only worth running once a PR is out of Draft. GitHub
    # treats a skipped job as satisfying a required status check, so a Draft
    # PR is not blocked by this while it is still being worked on.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/scripts run elaine:capability-parity
      - run: pnpm --filter @workspace/scripts run elaine:operation-catalog

  test-db:
    name: DB library tests (drizzle-contracts upgrade guard)
    # Runs the drizzle-contracts test suite so that Dependabot PRs that bump
    # drizzle-orm are automatically validated against the upgrade guard.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/db run test

  test-api-server:
    name: API server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/api-server run test

  test-api-client:
    name: API client tests (getUploadErrorMessage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/api-client-react run test

  test-app-shell:
    name: Shared application shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/app-shell run test
      - run: pnpm --filter @workspace/scripts run check-app-shell

  secrets-scan:
    name: Secrets / credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Scan all public files for credentials and secret patterns
        run: pnpm --filter @workspace/scripts run check-public-file-secrets

  security-audit:
    name: Security audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Audit dependencies for high-severity advisories
        # pnpm overrides in pnpm-workspace.yaml already force patched versions for
        # known CVEs into the lockfile — pnpm audit naturally checks the resolved
        # (overridden) versions, so a passing audit means every override is in
        # effect. Any NEW high-severity advisory not yet covered by an override
        # will fail this step and require an explicit override entry + comment.
        run: pnpm audit --audit-level high
      - name: Check for stale security overrides
        # Non-blocking advisory check: warns when a security override floor is
        # already exceeded by the natural (upstream) resolved version, meaning
        # the override may be removable.  Always exits 0; output is informational.
        run: pnpm --filter @workspace/scripts run check-stale-overrides

  pii-scan:
    name: PII email scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Check for forbidden provisioning-script filenames
        run: |
          # Block one-off provisioning scripts (add-users, seed-users, create-accounts,
          # etc.) — these commonly contain hardcoded household emails / passwords and
          # must never appear in the public repo.
          FORBIDDEN=$(find . \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './**/node_modules/*' \
            \( \
              -name 'add-users.*'       -o -name 'add-user.*'       \
              -o -name 'seed-users.*'   -o -name 'seed-user.*'       \
              -o -name 'create-accounts.*' -o -name 'create-account.*' \
              -o -name 'provision-users.*' -o -name 'provision-user.*' \
              -o -name 'bootstrap-users.*' -o -name 'bootstrap-user.*' \
            \) \
            2>/dev/null || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "🚫 Forbidden provisioning-script filenames found:"
            echo "$FORBIDDEN"
            echo "These files often contain hardcoded household emails/passwords."
            echo "Delete or rename them before merging."
            exit 1
          fi
          echo "✓ No forbidden provisioning-script filenames"
      - run: pnpm --filter @workspace/scripts run pii-scan

  codegen-drift:
    name: Codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Heavier check — deferred to the ready-for-review stage, see
    # elaine-capability-parity above for why this is safe.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @workspace/api-spec run codegen
      - name: Fail if codegen produced a diff
        run: |
          if ! git diff --quiet; then
            echo "Generated API types/spec are out of date. Run 'pnpm --filter @workspace/api-spec run codegen' locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  e2e-critical:
    name: E2E critical-path (Chromium)
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    env:
      PORT: "4173"
      BASE_PATH: "/"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/e2e exec playwright install chromium --with-deps
      - name: Build web artifact
        run: pnpm --filter @workspace/web run build
      - name: Run critical-path E2E tests
        run: pnpm --filter @workspace/e2e run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: artifacts/e2e/playwright-report/
          retention-days: 7

  guard-elaine-widget:
    name: Guard — Elaine widget globally mounted in modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify GlobalElaineWidget is in modules App.tsx
        run: |
          if ! grep -q "GlobalElaineWidget" artifacts/modules/src/App.tsx; then
            echo "❌ GlobalElaineWidget is missing from artifacts/modules/src/App.tsx"
            echo "   The Elaine chat widget will not appear on Pottery, Quilting, Ornaments, or Office pages."
            echo "   Add <GlobalElaineWidget /> to the Routes() return in App.tsx."
            exit 1
          fi
          echo "✓ GlobalElaineWidget present in modules/App.tsx"
      - name: Verify AssistantWidget not duplicated in TravelsLayout
        run: |
          if grep -q "AssistantWidget" artifacts/modules/src/travels/components/Layout.tsx; then
            echo "❌ AssistantWidget still present in TravelsLayout"
            echo "   This would render two Elaine widgets on Travels pages."
            echo "   Remove AssistantWidget from Layout.tsx — GlobalElaineWidget covers Travels too."
            exit 1
          fi
          echo "✓ TravelsLayout does not contain a duplicate AssistantWidget"

  e2e-modules:
    name: E2E smoke (modules)
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    env:
      PORT: "4174"
      BASE_PATH: "/modules/"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/e2e exec playwright install chromium --with-deps
      - name: Build modules artifact
        run: pnpm --filter @workspace/modules run build
      - name: Run modules smoke tests
        run: pnpm --filter @workspace/e2e exec playwright test --config playwright.modules.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-modules-report-${{ github.run_id }}
          path: artifacts/e2e/playwright-report-modules/
          retention-days: 7

  e2e-elaine:
    name: E2E smoke (Elaine)
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    env:
      PORT: "4175"
      BASE_PATH: "/elaine/"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/e2e exec playwright install chromium --with-deps
      - name: Build Elaine artifact
        run: pnpm --filter @workspace/elaine run build
      - name: Run Elaine smoke tests
        run: pnpm --filter @workspace/e2e exec playwright test --config playwright.elaine.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-elaine-report-${{ github.run_id }}
          path: artifacts/e2e/playwright-report-elaine/
          retention-days: 7
