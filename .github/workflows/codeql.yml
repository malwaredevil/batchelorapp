name: CodeQL

# Runs on every PR so that the "Analyze (actions)" and
# "Analyze (javascript-typescript)" required status checks always post a
# result — either a full scan or a "skipped" result. GitHub treats a skipped
# job as satisfying a required status check, so workflow-only Dependabot PRs
# are no longer permanently blocked.
#
# This repository-managed advanced setup is the sole CodeQL scanner; GitHub's
# default setup must be disabled or it rejects the uploaded SARIF results.
# Weekly scans preserve ongoing coverage. The security-only main scan publishes
# default-branch alerts; ordinary build/test workflows remain PR-only.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Step 1: detect which broad categories of files changed ──────────────
  # Outputs two booleans consumed by the Analyze jobs below. Keeping this as
  # a separate job avoids the need for a third-party paths-filter action.
  changes:
    name: Detect changed file categories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      actions: ${{ steps.detect.outputs.actions }}
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Scheduled/manual/main scans have no PR SHAs and must scan both
          # languages instead of trying to compare absent commit references.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "actions=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # Did any GitHub Actions workflow files change?
          if echo "$CHANGED" | grep -q "^\.github/workflows/"; then
            echo "actions=true"  >> "$GITHUB_OUTPUT"
          else
            echo "actions=false" >> "$GITHUB_OUTPUT"
          fi

          # Did any non-workflow files change?
          NON_WORKFLOW=$(echo "$CHANGED" | grep -v "^\.github/workflows/" || true)
          if [ -n "$NON_WORKFLOW" ]; then
            echo "code=true"  >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Step 2a: scan GitHub Actions workflow files ──────────────────────────
  # Job name MUST stay "Analyze (actions)" — it is a required status check.
  # When no workflow files changed the job is skipped; GitHub counts a skipped
  # required check as satisfied, unblocking workflow-only Dependabot PRs.
  analyze-actions:
    name: Analyze (actions)
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions

  # ── Step 2b: scan JavaScript / TypeScript source code ───────────────────
  # Job name MUST stay "Analyze (javascript-typescript)" — required check.
  # Skipped (satisfying the required check) when only workflow files changed
  # — the common case for GitHub-Actions-only Dependabot PRs.
  analyze-js-ts:
    name: Analyze (javascript-typescript)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
