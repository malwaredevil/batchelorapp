name: Dependabot auto-merge

on:
  pull_request_target:

# Minimal permissions for this workflow: contents + pull-requests write are
# needed for the auto-merge step. fetch-metadata reads from the event payload
# and does not require a separate metadata permission.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    steps:
      # Check out the BASE branch (main), not the PR head, so we can safely
      # run the decision script from our own trusted code.  Never check out
      # the PR head on pull_request_target — it could be attacker-controlled.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts

      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          GHSA_IDS: ${{ steps.metadata.outputs.ghsa-ids }}
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"

          if [[ "$DECISION" == merge-* ]]; then
            echo "Auto-merging PR #$PR_NUMBER (reason: $DECISION)"
            gh pr merge --auto --squash "$PR_NUMBER"
          else
            echo "Skipping PR #$PR_NUMBER (reason: $DECISION)"
          fi
