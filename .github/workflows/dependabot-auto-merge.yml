name: Dependabot auto-merge

on:
  pull_request_target:

# Minimal permissions for this workflow: contents + pull-requests write are
# needed for the auto-merge step. fetch-metadata reads from the event payload
# and does not require a separate metadata permission.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: This workflow uses pull_request_target and therefore MUST NOT
      # check out repository code (the security policy enforces this).  All
      # decision logic lives inline below so it can be extracted and tested
      # by .github/workflows/test-dependabot-auto-merge.yml without checkout.
      - name: Decide and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          GHSA_IDS: ${{ steps.metadata.outputs.ghsa-ids }}
        run: |
          set -euo pipefail
          echo "Ecosystem:    $ECOSYSTEM"
          echo "Update type:  $UPDATE_TYPE"
          echo "Dependencies: $DEPENDENCY_NAMES"
          echo "GHSA IDs:     ${GHSA_IDS:-<none>}"

          # ------------------------------------------------------------------
          # 1. High/critical security advisory → auto-merge regardless of type
          # ------------------------------------------------------------------
          if [ -n "${GHSA_IDS:-}" ]; then
            FOUND_VALID=false
            for GHSA in $(echo "$GHSA_IDS" | tr ',' '\n' | xargs); do
              # Validate GHSA ID format: GHSA-xxxx-xxxx-xxxx (alphanumeric only).
              if [[ ! "$GHSA" =~ ^GHSA-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}$ ]]; then
                echo "Skipping malformed GHSA ID: $GHSA"
                continue
              fi
              FOUND_VALID=true
              SEVERITY=$(gh api "/advisories/$GHSA" --jq '.severity' 2>/dev/null || echo "unknown")
              echo "Advisory $GHSA severity: $SEVERITY"
              if [ "$SEVERITY" = "high" ] || [ "$SEVERITY" = "critical" ]; then
                echo "Auto-merging PR #$PR_NUMBER for $SEVERITY advisory $GHSA"
                gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
                exit 0
              fi
            done
            if [ "$FOUND_VALID" = "true" ]; then
              echo "No high/critical advisories — skipping security auto-merge"
            else
              echo "All GHSA IDs were malformed — skipping security auto-merge"
            fi
          fi

          # ------------------------------------------------------------------
          # 2. Low-risk bump path
          # ------------------------------------------------------------------
          PACKAGE_COUNT=$(echo "$DEPENDENCY_NAMES" | tr ',' '\n' | grep -c .)
          echo "Package count: $PACKAGE_COUNT"

          # GitHub Actions bumps carry zero app-code risk — auto-merge minor
          # and patch, but never major (could change the action interface).
          if [ "$ECOSYSTEM" = "github_actions" ]; then
            if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
              echo "Skipping major GitHub Actions bump — requires manual review"
              exit 0
            fi
            echo "Auto-merging GitHub Actions $UPDATE_TYPE bump for PR #$PR_NUMBER"
            gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
            exit 0
          fi

          # For all other ecosystems auto-merge only single-package patch bumps.
          # Grouped PRs (multiple packages) are skipped to avoid silent breaking
          # changes.
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ] && [ "$PACKAGE_COUNT" -eq 1 ]; then
            echo "Auto-merging single-package patch bump for PR #$PR_NUMBER"
            gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
            exit 0
          fi

          if [ "$PACKAGE_COUNT" -gt 1 ]; then
            echo "Skipping grouped PR ($PACKAGE_COUNT packages) — requires manual review"
          else
            echo "Skipping $UPDATE_TYPE bump for $ECOSYSTEM — requires manual review"
          fi
