name: Guardrails

# pull_request only — see ci.yml for why the old "push: branches: [main]"
# trigger was removed (it never gated anything; the PR-time run already did).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history is required so check-guardrails.ts can diff against
      # origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: "0"
      - uses: ./.github/actions/setup-workspace

      - name: "Guardrail checks (single source of truth: scripts/src/check-guardrails.ts)"
        run: pnpm --filter @workspace/scripts run check-guardrails -- --base origin/main

      - name: "Security: GitHub workflow policy"
        run: pnpm --filter @workspace/scripts run check-workflow-security

      - name: "Architecture: domain composition boundaries"
        run: pnpm --filter @workspace/scripts run check-domain-composition

      - name: "Scheduler: all task names registered in KNOWN_SCHEDULER_NAMES"
        run: pnpm --filter @workspace/scripts run check-scheduler-names

      - name: "Ban: raw fetch('/api/...') in frontend artifacts"
        run: pnpm --filter @workspace/scripts run check-raw-fetch

      - name: "Ban: hardcoded configuration values (should be owner-adjustable)"
        run: pnpm --filter @workspace/scripts run check-hardcoded-config -- --base origin/main
