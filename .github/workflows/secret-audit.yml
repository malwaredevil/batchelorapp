name: Secret Audit (temporary)
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Hash secrets
        env:
          AGENTPHONE_API_KEY: ${{ secrets.AGENTPHONE_API_KEY }}
          AGENTPHONE_WEBHOOK_SECRET: ${{ secrets.AGENTPHONE_WEBHOOK_SECRET }}
          AGENT_LOGIN_EMAIL: ${{ secrets.AGENT_LOGIN_EMAIL }}
          AGENT_LOGIN_PASSWORD: ${{ secrets.AGENT_LOGIN_PASSWORD }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_WEBHOOK_SECRET: ${{ secrets.APIFY_WEBHOOK_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_SCREENSHOT_TOKEN: ${{ secrets.DEV_SCREENSHOT_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_WALLET_ISSUER_ID: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GOOGLE_WALLET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_WALLET_SERVICE_ACCOUNT_JSON }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_REMINDER_FROM_EMAIL: ${{ secrets.RESEND_REMINDER_FROM_EMAIL }}
          RESEND_WEBHOOK_SECRET_DEV: ${{ secrets.RESEND_WEBHOOK_SECRET_DEV }}
          RESEND_WEBHOOK_SECRET_PROD: ${{ secrets.RESEND_WEBHOOK_SECRET_PROD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG_ID: ${{ secrets.SENTRY_ORG_ID }}
          SENTRY_ORG_SLUG: ${{ secrets.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT_ID: ${{ secrets.SENTRY_PROJECT_ID }}
          SENTRY_PROJECT_SLUG: ${{ secrets.SENTRY_PROJECT_SLUG }}
          SENTRY_RELEASE_WEBHOOK_URL: ${{ secrets.SENTRY_RELEASE_WEBHOOK_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          names=(AGENTPHONE_API_KEY AGENTPHONE_WEBHOOK_SECRET AGENT_LOGIN_EMAIL AGENT_LOGIN_PASSWORD APIFY_API_TOKEN APIFY_WEBHOOK_SECRET DATABASE_URL DEV_SCREENSHOT_TOKEN EBAY_APP_ID EBAY_CERT_ID EBAY_DEV_ID GH_PAT GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_MAPS_API_KEY GOOGLE_WALLET_ISSUER_ID GOOGLE_WALLET_SERVICE_ACCOUNT_JSON JINA_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY OAUTH_TOKEN_ENCRYPTION_KEY RESEND_API_KEY RESEND_FROM_EMAIL RESEND_REMINDER_FROM_EMAIL RESEND_WEBHOOK_SECRET_DEV RESEND_WEBHOOK_SECRET_PROD SENTRY_AUTH_TOKEN SENTRY_DSN SENTRY_ORG_ID SENTRY_ORG_SLUG SENTRY_PROJECT_ID SENTRY_PROJECT_SLUG SENTRY_RELEASE_WEBHOOK_URL SESSION_SECRET SLACK_BOT_TOKEN SLACK_SIGNING_SECRET SUPABASE_ANON_KEY SUPABASE_POOLER_HOST SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT VITE_GOOGLE_MAPS_API_KEY VITE_SENTRY_DSN VITE_VAPID_PUBLIC_KEY VOYAGE_API_KEY)
          for name in "${names[@]}"; do
            val="${!name}"
            if [ -n "$val" ]; then
              hash=$(printf '%s' "$val" | sha256sum | cut -c1-64)
              echo "SECRET_HASH_${name}=${hash}"
            else
              echo "SECRET_HASH_${name}=MISSING"
            fi
          done
