name: Test Dependabot auto-merge logic

# Runs whenever dependabot-auto-merge.yml itself changes so any edit to the
# inline policy is automatically re-validated.  Can also be triggered manually.
#
# DESIGN NOTE: dependabot-auto-merge.yml uses pull_request_target, which the
# repository security policy forbids from checking out code.  All decision
# logic therefore lives inline in that workflow's "Decide and auto-merge" step.
# This test workflow checks out the repo (safe on a normal pull_request),
# extracts that exact inline run: block via YAML parsing, and executes it with
# a mock `gh` binary — so every case exercises the production code directly.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dependabot-auto-merge.yml"
      - ".github/workflows/test-dependabot-auto-merge.yml"

permissions:
  contents: read

jobs:
  test-merge-logic:
    name: Validate auto-merge decision branches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      # Extract the inline run: script from the "Decide and auto-merge" step
      # of dependabot-auto-merge.yml into /tmp/production-decision.sh.
      # If the step is renamed or removed this extraction step fails loudly.
      - name: Extract production decision script
        run: |
          python3 - << 'EOF'
          import yaml, sys, os

          with open('.github/workflows/dependabot-auto-merge.yml') as f:
              wf = yaml.safe_load(f)

          jobs = wf.get('jobs', {})
          for job in jobs.values():
              for step in job.get('steps', []):
                  name = step.get('name', '')
                  if 'Decide and auto-merge' in name:
                      script = step.get('run', '')
                      with open('/tmp/production-decision.sh', 'w') as out:
                          out.write(script)
                      print(f"Extracted {len(script)} bytes from '{name}'")
                      sys.exit(0)

          print("FAIL: 'Decide and auto-merge' step not found in dependabot-auto-merge.yml",
                file=sys.stderr)
          sys.exit(1)
          EOF

      # Build a mock `gh` binary placed ahead of the real one in PATH.
      # - `gh api .../advisories/...`: returns the value of MOCK_GHSA_SEVERITY
      #   (default "low"), simulating the advisory severity lookup.
      # - `gh pr merge ...`: records the call to /tmp/gh-calls.log so tests can
      #   assert whether auto-merge was triggered or not.
      - name: Install mock gh binary
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'GH_EOF'
          #!/usr/bin/env bash
          if [[ "$*" == *"api"*"advisories"* ]]; then
            echo "${MOCK_GHSA_SEVERITY:-low}"
            exit 0
          fi
          echo "GH_CALLED: $*" >> /tmp/gh-calls.log
          GH_EOF
          chmod +x /tmp/mock-bin/gh

      # Helper: run one test case and assert the expected outcome.
      #   EXPECT_MERGE=true  → gh pr merge must have been called
      #   EXPECT_MERGE=false → gh pr merge must NOT have been called
      - name: Define run_case helper and run all cases
        run: |
          export PATH="/tmp/mock-bin:$PATH"

          run_case() {
            local label="$1"
            local expect_merge="$2"
            rm -f /tmp/gh-calls.log

            # Run the production script; GH_TOKEN and PR_NUMBER are mocked.
            GH_TOKEN="mock" PR_NUMBER="999" bash /tmp/production-decision.sh

            if grep -q "pr merge" /tmp/gh-calls.log 2>/dev/null; then
              MERGED=true
            else
              MERGED=false
            fi

            if [ "$MERGED" = "$expect_merge" ]; then
              echo "✓ $label"
            else
              echo "✗ $label — expected merge=$expect_merge, got merge=$MERGED"
              exit 1
            fi
          }

          # ------------------------------------------------------------------
          # GitHub Actions ecosystem
          # ------------------------------------------------------------------

          export ECOSYSTEM="github_actions" DEPENDENCY_NAMES="actions/checkout" GHSA_IDS=""

          export UPDATE_TYPE="version-update:semver-patch"
          run_case "GH Actions patch → auto-merges" true

          export UPDATE_TYPE="version-update:semver-minor"
          run_case "GH Actions minor → auto-merges" true

          export UPDATE_TYPE="version-update:semver-major"
          run_case "GH Actions major → skipped (manual review)" false

          # ------------------------------------------------------------------
          # npm / other ecosystems
          # ------------------------------------------------------------------

          export ECOSYSTEM="npm" GHSA_IDS=""

          export UPDATE_TYPE="version-update:semver-patch" DEPENDENCY_NAMES="zod"
          run_case "npm single-package patch → auto-merges" true

          export UPDATE_TYPE="version-update:semver-patch" DEPENDENCY_NAMES="zod, typescript"
          run_case "npm grouped 2-package patch → skipped" false

          export UPDATE_TYPE="version-update:semver-patch" DEPENDENCY_NAMES="zod, react, typescript"
          run_case "npm grouped 3-package patch → skipped" false

          export UPDATE_TYPE="version-update:semver-minor" DEPENDENCY_NAMES="zod"
          run_case "npm single-package minor → skipped" false

          export UPDATE_TYPE="version-update:semver-major" DEPENDENCY_NAMES="zod"
          run_case "npm single-package major → skipped" false

          # ------------------------------------------------------------------
          # GHSA security advisory path
          # (MOCK_GHSA_SEVERITY overrides the gh api advisory lookup)
          # ------------------------------------------------------------------

          export ECOSYSTEM="npm" UPDATE_TYPE="version-update:semver-minor" \
                 DEPENDENCY_NAMES="lodash" GHSA_IDS="GHSA-1234-abcd-5678"

          MOCK_GHSA_SEVERITY=critical run_case "GHSA critical → auto-merges" true
          MOCK_GHSA_SEVERITY=high     run_case "GHSA high → auto-merges"     true
          MOCK_GHSA_SEVERITY=medium   run_case "GHSA medium → skipped"       false
          MOCK_GHSA_SEVERITY=low      run_case "GHSA low → skipped"          false

          # Malformed GHSA ID — the validation regex should reject it and skip
          export GHSA_IDS="NOT-A-VALID-ID"
          MOCK_GHSA_SEVERITY=critical run_case "Malformed GHSA → skipped" false

          # ------------------------------------------------------------------
          # Edge case: empty GHSA_IDS falls through to low-risk path
          # ------------------------------------------------------------------

          export ECOSYSTEM="github_actions" UPDATE_TYPE="version-update:semver-patch" \
                 DEPENDENCY_NAMES="actions/setup-node" GHSA_IDS=""
          run_case "Empty GHSA_IDS → falls through to low-risk path → merges" true

          echo ""
          echo "All cases passed."
