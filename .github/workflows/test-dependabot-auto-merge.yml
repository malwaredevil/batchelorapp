name: Test Dependabot auto-merge logic

# Runs on pull_request when either workflow file or the decision script
# changes, so any edit to the policy is automatically re-validated.
# Can also be triggered manually via workflow_dispatch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dependabot-auto-merge.yml"
      - ".github/workflows/test-dependabot-auto-merge.yml"
      - ".github/scripts/dependabot-merge-decision.sh"

permissions:
  contents: read

jobs:
  test-merge-logic:
    name: Validate auto-merge decision branches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Make decision script executable
        run: chmod +x .github/scripts/dependabot-merge-decision.sh

      # ------------------------------------------------------------------
      # GitHub Actions ecosystem
      # ------------------------------------------------------------------

      - name: "GH Actions patch → merge-actions"
        env:
          ECOSYSTEM: "github_actions"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "actions/checkout"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "merge-actions" ] || (echo "FAIL: expected merge-actions, got $DECISION" && exit 1)

      - name: "GH Actions minor → merge-actions"
        env:
          ECOSYSTEM: "github_actions"
          UPDATE_TYPE: "version-update:semver-minor"
          DEPENDENCY_NAMES: "actions/checkout"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "merge-actions" ] || (echo "FAIL: expected merge-actions, got $DECISION" && exit 1)

      - name: "GH Actions major → skip-major-actions"
        env:
          ECOSYSTEM: "github_actions"
          UPDATE_TYPE: "version-update:semver-major"
          DEPENDENCY_NAMES: "actions/checkout"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "skip-major-actions" ] || (echo "FAIL: expected skip-major-actions, got $DECISION" && exit 1)

      # ------------------------------------------------------------------
      # npm ecosystem
      # ------------------------------------------------------------------

      - name: "npm single-package patch → merge-npm-patch"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "zod"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "merge-npm-patch" ] || (echo "FAIL: expected merge-npm-patch, got $DECISION" && exit 1)

      - name: "npm grouped 3 packages patch → skip-grouped-3"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "zod, react, typescript"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "skip-grouped-3" ] || (echo "FAIL: expected skip-grouped-3, got $DECISION" && exit 1)

      - name: "npm grouped 2 packages patch → skip-grouped-2"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "zod, typescript"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "skip-grouped-2" ] || (echo "FAIL: expected skip-grouped-2, got $DECISION" && exit 1)

      - name: "npm single-package minor → skip-update-type"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-minor"
          DEPENDENCY_NAMES: "zod"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [[ "$DECISION" == skip-update-type-* ]] || (echo "FAIL: expected skip-update-type-*, got $DECISION" && exit 1)

      - name: "npm single-package major → skip-update-type"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-major"
          DEPENDENCY_NAMES: "zod"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [[ "$DECISION" == skip-update-type-* ]] || (echo "FAIL: expected skip-update-type-*, got $DECISION" && exit 1)

      # ------------------------------------------------------------------
      # GHSA security advisory path (SEVERITY_OVERRIDE mocks gh api call)
      # ------------------------------------------------------------------

      - name: "GHSA critical → merge-security-<GHSA>"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-minor"
          DEPENDENCY_NAMES: "lodash"
          GHSA_IDS: "GHSA-1234-abcd-5678"
          SEVERITY_OVERRIDE: "critical"
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [[ "$DECISION" == merge-security-* ]] || (echo "FAIL: expected merge-security-*, got $DECISION" && exit 1)

      - name: "GHSA high → merge-security-<GHSA>"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "lodash"
          GHSA_IDS: "GHSA-abcd-1234-ef56"
          SEVERITY_OVERRIDE: "high"
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [[ "$DECISION" == merge-security-* ]] || (echo "FAIL: expected merge-security-*, got $DECISION" && exit 1)

      - name: "GHSA medium → skip-ghsa-low-medium (not auto-merged)"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "lodash"
          GHSA_IDS: "GHSA-abcd-1234-ef56"
          SEVERITY_OVERRIDE: "medium"
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "skip-ghsa-low-medium" ] || (echo "FAIL: expected skip-ghsa-low-medium, got $DECISION" && exit 1)

      - name: "GHSA low → skip-ghsa-low-medium (not auto-merged)"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "lodash"
          GHSA_IDS: "GHSA-abcd-1234-ef56"
          SEVERITY_OVERRIDE: "low"
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "skip-ghsa-low-medium" ] || (echo "FAIL: expected skip-ghsa-low-medium, got $DECISION" && exit 1)

      - name: "GHSA malformed ID → skip-ghsa-malformed"
        env:
          ECOSYSTEM: "npm"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "lodash"
          GHSA_IDS: "NOT-A-VALID-ID"
          SEVERITY_OVERRIDE: "critical"
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "skip-ghsa-malformed" ] || (echo "FAIL: expected skip-ghsa-malformed, got $DECISION" && exit 1)

      # ------------------------------------------------------------------
      # Edge cases
      # ------------------------------------------------------------------

      - name: "Empty GHSA_IDS → falls through to low-risk path"
        env:
          ECOSYSTEM: "github_actions"
          UPDATE_TYPE: "version-update:semver-patch"
          DEPENDENCY_NAMES: "actions/setup-node"
          GHSA_IDS: ""
        run: |
          DECISION=$(bash .github/scripts/dependabot-merge-decision.sh)
          echo "Decision: $DECISION"
          [ "$DECISION" = "merge-actions" ] || (echo "FAIL: expected merge-actions, got $DECISION" && exit 1)

      - name: All cases passed
        run: echo "All dependabot-merge-decision.sh branches validated."
