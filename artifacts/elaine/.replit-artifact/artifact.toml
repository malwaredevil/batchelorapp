kind = "web"
previewPath = "/elaine/"
title = "Elaine"
version = "1.0.0"
id = "artifacts/elaine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/elaine/" ]
localPort = 25669

[services.development]
run = "pnpm --filter @workspace/elaine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elaine", "run", "build" ]
publicDir = "artifacts/elaine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Content-Type-Options"
value = "nosniff"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Frame-Options"
value = "SAMEORIGIN"

[[services.production.responseHeaders]]
path = "/*"
name = "Referrer-Policy"
value = "strict-origin-when-cross-origin"

[[services.production.responseHeaders]]
path = "/*"
name = "Permissions-Policy"
value = "geolocation=(), camera=(), microphone=()"

[services.env]
PORT = "25669"
BASE_PATH = "/elaine/"
