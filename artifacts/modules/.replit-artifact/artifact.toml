kind = "web"
previewPath = "/modules/"
title = "Modules"
version = "1.0.0"
id = "artifacts/modules"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/modules/" ]
localPort = 25313

[services.development]
run = "pnpm --filter @workspace/modules run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/modules", "run", "build" ]
publicDir = "artifacts/modules/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Content-Type-Options"
value = "nosniff"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Frame-Options"
value = "SAMEORIGIN"

[[services.production.responseHeaders]]
path = "/*"
name = "Referrer-Policy"
value = "strict-origin-when-cross-origin"

[[services.production.responseHeaders]]
path = "/*"
name = "Permissions-Policy"
value = "geolocation=(), camera=(), microphone=()"

[services.env]
PORT = "25313"
BASE_PATH = "/modules/"
