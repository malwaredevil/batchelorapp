kind = "web"
previewPath = "/"
title = "Batchelor"
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
publicDir = "artifacts/web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Content-Type-Options"
value = "nosniff"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Frame-Options"
value = "SAMEORIGIN"

[[services.production.responseHeaders]]
path = "/*"
name = "Referrer-Policy"
value = "strict-origin-when-cross-origin"

[[services.production.responseHeaders]]
path = "/*"
name = "Permissions-Policy"
value = "geolocation=(), camera=(self), microphone=()"

[services.env]
PORT = "22333"
BASE_PATH = "/"
