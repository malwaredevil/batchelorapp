<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Colorful fridge magnets</title>
  <desc id="desc">A collection of colorful horseshoe magnets arranged on a warm cyan background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#082f49" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="170" fill="#67e8f9" opacity=".12"/>
  <circle cx="150" cy="470" r="210" fill="#a5f3fc" opacity=".08"/>
  <g filter="url(#shadow)" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M250 165v100a95 95 0 0 0 190 0V165" stroke="#f43f5e"/>
    <path d="M525 115v100a95 95 0 0 0 190 0V115" stroke="#fbbf24"/>
    <path d="M805 185v100a95 95 0 0 0 190 0V185" stroke="#a78bfa"/>
  </g>
  <g fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="600" y="430" text-anchor="middle" font-size="46" font-weight="700" letter-spacing="5">MAGNETS</text>
    <text x="600" y="470" text-anchor="middle" font-size="18" opacity=".78" letter-spacing="2">YOUR COLLECTION</text>
  </g>
</svg>