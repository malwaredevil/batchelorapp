openapi: 3.1.0
info:
  title: Magnets API
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listMagnets
      tags:
        - magnets
      summary: List magnets (paginated)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: categoryIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: uncategorized
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - newest
              - oldest
              - name-asc
              - name-desc
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagnetListResponse"
    post:
      operationId: createMagnet
      tags:
        - magnets
      summary: Create a magnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagnetCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagnetItem"
  /items/{id}:
    get:
      operationId: getMagnet
      tags:
        - magnets
      summary: Get a magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The magnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagnetItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMagnet
      tags:
        - magnets
      summary: Update a magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagnetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagnetItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMagnet
      tags:
        - magnets
      summary: Soft-delete a magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/reanalyze:
    post:
      operationId: reanalyzeMagnet
      tags:
        - magnets
      summary: Re-analyse a magnet with AI vision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated magnet item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagnetItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: No primary image available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/images:
    post:
      operationId: addMagnetImage
      tags:
        - magnets
      summary: Upload a photo for a magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                label:
                  type: string
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagnetImage"
        "400":
          description: Invalid or unsupported file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/images/{imageId}:
    patch:
      operationId: updateMagnetImage
      tags:
        - magnets
      summary: Update a supplemental image's label
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagnetImageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagnetImage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMagnetImage
      tags:
        - magnets
      summary: Delete a photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/images/{imageId}/primary:
    post:
      operationId: setMagnetPrimaryImage
      tags:
        - magnets
      summary: Promote an image to primary (gallery cover)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Primary image updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - imagePath
                properties:
                  id:
                    type: integer
                  imagePath:
                    type:
                      - string
                      - "null"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories:
    get:
      operationId: listMagnetCategories
      tags:
        - magnets
      summary: List categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createMagnetCategory
      tags:
        - magnets
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories/unused:
    delete:
      operationId: deleteMagnetUnusedCategories
      tags:
        - magnets
      summary: Delete all categories with no items assigned
      responses:
        "200":
          description: Number of categories deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
  /categories/{id}:
    patch:
      operationId: renameMagnetCategory
      tags:
        - magnets
      summary: Rename a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMagnetCategory
      tags:
        - magnets
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories/{id}/colors:
    put:
      operationId: updateMagnetCategoryColors
      tags:
        - magnets
      summary: Update a category's colours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryColorInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories/{id}/merge:
    post:
      operationId: mergeMagnetCategory
      tags:
        - magnets
      summary: Merge a category into another (reassigns items, deletes source)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCategoryInput"
      responses:
        "204":
          description: Merged and deleted
        "400":
          description: Cannot merge a category into itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Source or target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    MagnetItem:
      type: object
      required:
        - id
        - name
        - lockedFields
        - createdAt
        - categories
        - images
        - imageUrl
        - primaryImageId
      properties:
        id:
          type: integer
        name:
          type: string
        notes:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        lockedFields:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        images:
          type: array
          items:
            $ref: "#/components/schemas/MagnetImage"
        imageUrl:
          type:
            - string
            - "null"
        primaryImageId:
          type:
            - integer
            - "null"
        createdAt:
          type: string
    MagnetCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        notes:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        categoryIds:
          type: array
          items:
            type: integer
    MagnetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        notes:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        lockedFields:
          type: array
          items:
            type: string
        categoryIds:
          type: array
          items:
            type: integer
    MagnetListResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MagnetItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    MagnetImage:
      type: object
      required:
        - id
        - url
        - position
      properties:
        id:
          type: integer
        url:
          type: string
        label:
          type:
            - string
            - "null"
        position:
          type: integer
    MagnetImageUpdate:
      type: object
      properties:
        label:
          type:
            - string
            - "null"
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        bgColor:
          type:
            - string
            - "null"
        textColor:
          type:
            - string
            - "null"
        count:
          type: integer
    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        bgColor:
          type:
            - string
            - "null"
        textColor:
          type:
            - string
            - "null"
    CategoryColorInput:
      type: object
      properties:
        bgColor:
          type:
            - string
            - "null"
        textColor:
          type:
            - string
            - "null"
    MergeCategoryInput:
      type: object
      required:
        - intoId
      properties:
        intoId:
          type: integer
