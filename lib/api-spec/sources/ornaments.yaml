openapi: 3.1.0
info:
  title: Ornaments
  version: 0.1.0
paths:
  /items:
    get:
      operationId: listOrnaments
      tags:
        - ornaments
      summary: List ornaments
      parameters:
        - name: q
          in: query
          required: false
          description: Text search across name, series/collection, brand, notes, and description
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: seriesOrCollection
          in: query
          required: false
          schema:
            type: string
        - name: year
          in: query
          required: false
          schema:
            type: integer
        - name: categoryIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: uncategorized
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: color
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                newest,
                oldest,
                year-desc,
                year-asc,
                name-asc,
                name-desc,
                value-desc,
              ]
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: Paginated collection list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentListResponse"
    post:
      operationId: createOrnament
      tags:
        - ornaments
      summary: Add an ornament
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/stragglers:
    get:
      operationId: getOrnamentStragglers
      tags:
        - ornaments
      summary: List ornaments missing an embedding or core attributes
      responses:
        "200":
          description: Stragglers needing re-analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stragglers"
  /items/bulk-reanalyze:
    post:
      operationId: bulkReanalyzeOrnaments
      tags:
        - ornaments
      summary: Re-run AI analysis on multiple ornaments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkReanalyzeInput"
      responses:
        "200":
          description: Bulk reanalysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkReanalyzeResult"
  /items/{id}:
    get:
      operationId: getOrnament
      tags:
        - ornaments
      summary: Get an ornament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The ornament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateOrnament
      tags:
        - ornaments
      summary: Update an ornament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrnamentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOrnament
      tags:
        - ornaments
      summary: Remove an ornament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/reanalyze:
    post:
      operationId: reanalyzeOrnament
      tags:
        - ornaments
      summary: Re-run AI analysis on an ornament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated with fresh AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/set-primary-image:
    post:
      operationId: setOrnamentPrimaryImage
      tags:
        - ornaments
      summary: Promote a supplemental image to primary and re-analyse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrimaryImageSelection"
      responses:
        "200":
          description: Updated item with new primary image and fresh AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/images:
    post:
      operationId: addOrnamentImage
      tags:
        - ornaments
      summary: Add a supplemental image to an ornament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Image added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentImage"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ornament not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/images/{imageId}:
    patch:
      operationId: updateOrnamentImage
      tags:
        - ornaments
      summary: Update a supplemental image's label or position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrnamentImageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentImage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOrnamentImage
      tags:
        - ornaments
      summary: Remove a supplemental image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/lookup-barcode:
    post:
      operationId: lookupOrnamentBarcode
      tags:
        - ornaments
      summary: Look up a barcode via UPCitemdb and return candidate fields (does not save)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeLookupInput"
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeLookupResult"
  /items/lookup-barcode:
    post:
      operationId: lookupBarcode
      tags:
        - ornaments
      summary: Look up a barcode via UPCitemdb for the add-item form (does not save)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeLookupInput"
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeLookupResult"
  /items/report-barcode-correction:
    post:
      operationId: reportBarcodeCorrection
      tags:
        - ornaments
      summary: Submit a correction when a barcode lookup returned wrong information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeCorrectionInput"
      responses:
        "200":
          description: Correction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeCorrectionResult"
  /barcode-photo-lookup:
    post:
      operationId: extractOrnamentBarcodePhoto
      tags:
        - ornaments
      summary: Extract a barcode number from a photo using AI vision (escape hatch when camera scan fails)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodePhotoInput"
      responses:
        "200":
          description: Extracted barcode digits (null if no barcode visible or legible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodePhotoResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/refresh-all:
    post:
      operationId: refreshAllOrnamentData
      tags:
        - ornaments
      summary: Refresh all AI and market data — reanalyze images, book value, eBay price, and AI appraisal all at once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fully updated ornament after all refreshes complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /items/{id}/ai-appraisal:
    post:
      operationId: runOrnamentAiAppraisal
      tags:
        - ornaments
      summary: Run AI collector appraisal on an ornament and save the result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated ornament with fresh AI appraisal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # #214 — eBay sold-listings fallback
  /items/{id}/ebay-price-lookup:
    post:
      operationId: lookupOrnamentEbayPrice
      tags:
        - ornaments
      summary: Look up eBay sold-listing prices and cache them on the ornament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: >
                    When true, skip the 7-day staleness cache and fire a fresh
                    Apify sold-listings run regardless of the last fetch date.
      responses:
        "200":
          description: eBay price data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayPriceResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: No eBay listings found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Apify not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /items/{id}/book-value-lookup:
    post:
      operationId: lookupOrnamentBookValue
      tags:
        - ornaments
      summary: Look up and save the current book/insurance value from hallmarkornaments.com or hookedonhallmark.com
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated with fresh book value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: No book value could be found for this ornament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{id}/retail-value-lookup:
    post:
      operationId: lookupOrnamentRetailValue
      tags:
        - ornaments
      summary: Look up and save the original retail value (and product page link) via a grounded web search
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated with fresh retail value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrnamentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: No retail value could be found for this ornament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /series:
    get:
      operationId: listOrnamentSeries
      tags:
        - ornaments
      summary: List distinct series/collections with item counts
      responses:
        "200":
          description: Series list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesCount"
  /stats:
    get:
      operationId: getOrnamentStats
      tags:
        - ornaments
      summary: Collection dashboard summary (totals, book value, series breakdown)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
  /categories:
    get:
      operationId: listOrnamentCategories
      tags:
        - ornaments
      summary: List categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createOrnamentCategory
      tags:
        - ornaments
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories/unused:
    delete:
      operationId: deleteOrnamentUnusedCategories
      tags:
        - ornaments
      summary: Delete all categories that have no ornaments assigned
      responses:
        "200":
          description: Number of categories deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
  /categories/{id}:
    patch:
      operationId: renameOrnamentCategory
      tags:
        - ornaments
      summary: Rename a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOrnamentCategory
      tags:
        - ornaments
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories/{id}/colors:
    put:
      operationId: updateOrnamentCategoryColors
      tags:
        - ornaments
      summary: Update a category's background and text colours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryColorInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories/{id}/merge:
    post:
      operationId: mergeOrnamentCategory
      tags:
        - ornaments
      summary: Merge a category into another (reassigns all ornaments, deletes source)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCategoryInput"
      responses:
        "204":
          description: Merged and deleted
        "400":
          description: Cannot merge a category into itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Source or target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    EbayActiveListing:
      type: object
      required: [itemId, title, price, currency]
      properties:
        itemId:
          type: string
        title:
          type: string
        price:
          type: number
        currency:
          type: string
        condition:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        itemUrl:
          type: ["string", "null"]

    EbayForSaleResult:
      type: object
      required: [priceMinUsd, priceMaxUsd, listingCount, listings]
      properties:
        priceMinUsd:
          type: number
        priceMaxUsd:
          type: number
        listingCount:
          type: integer
        listings:
          type: array
          items:
            $ref: "#/components/schemas/EbayActiveListing"

    EbayLastSoldResult:
      type: object
      required: [priceUsd, listingCount]
      properties:
        priceUsd:
          type: number
        soldDate:
          type: ["string", "null"]
        listingCount:
          type: integer

    EbayPriceResult:
      type: object
      properties:
        forSale:
          oneOf:
            - $ref: "#/components/schemas/EbayForSaleResult"
            - type: "null"
        lastSold:
          oneOf:
            - $ref: "#/components/schemas/EbayLastSoldResult"
            - type: "null"
        searchQuery:
          type: string
        cachedAt:
          type: string

    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        bgColor:
          type:
            - string
            - "null"
        textColor:
          type:
            - string
            - "null"
        count:
          type: integer
          description: Number of ornaments assigned this category (only present on the category-list endpoint)
    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        bgColor:
          type:
            - string
            - "null"
        textColor:
          type:
            - string
            - "null"
    CategoryColorInput:
      type: object
      properties:
        bgColor:
          type:
            - string
            - "null"
        textColor:
          type:
            - string
            - "null"
    MergeCategoryInput:
      type: object
      required:
        - intoId
      properties:
        intoId:
          type: integer
    OrnamentImage:
      type: object
      required:
        - id
        - url
        - position
      properties:
        id:
          type: integer
        url:
          type: string
        label:
          type:
            - string
            - "null"
        position:
          type: integer
    PrimaryImageSelection:
      type: object
      required:
        - imageId
      properties:
        imageId:
          type: integer
    OrnamentImageUpdate:
      type: object
      properties:
        label:
          type:
            - string
            - "null"
        position:
          type: integer
    OrnamentListResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - searchMode
        - totalPages
        - facets
        - stats
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrnamentItem"
        total:
          type: integer
          description: Total number of items matching the query (before pagination)
        page:
          type: integer
        pageSize:
          type: integer
        searchMode:
          type: string
          enum: [semantic, keyword]
        totalPages:
          type: integer
        facets:
          $ref: "#/components/schemas/OrnamentListFacets"
        stats:
          $ref: "#/components/schemas/OrnamentListStats"
    OrnamentListFacets:
      type: object
      required: [colors]
      properties:
        colors:
          type: array
          items:
            type: string
    OrnamentListStats:
      type: object
      required: [categoryCount, brandCount]
      properties:
        categoryCount:
          type: integer
        brandCount:
          type: integer
        minYear:
          type: [integer, "null"]
        maxYear:
          type: [integer, "null"]
    OrnamentItem:
      type: object
      required:
        - id
        - name
        - brand
        - quantity
        - lockedFields
        - imageUrl
        - categories
        - images
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        brand:
          type: string
        seriesOrCollection:
          type:
            - string
            - "null"
        year:
          type:
            - integer
            - "null"
          description: Release/edition year printed on the ornament
        barcodeValue:
          type:
            - string
            - "null"
        quantity:
          type: integer
          minimum: 1
        lockedFields:
          type: array
          items:
            type: string
        notes:
          type:
            - string
            - "null"
        dimensions:
          type:
            - string
            - "null"
        condition:
          type:
            - string
            - "null"
        origin:
          type:
            - string
            - "null"
        aiDescription:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
          description: >-
            Verbatim text transcribed from the printed description on the
            back of the ornament's box (distinct from aiDescription, which
            is AI-authored). When no legible box-back text was found, the
            AI writes a stand-in instead — see descriptionGenerated.
        descriptionGenerated:
          type: boolean
          description: >-
            True when description above is an AI-generated stand-in because
            no legible box-back text was found (false for manual, verbatim,
            or catalog text).
        acquiredAt:
          type:
            - string
            - "null"
        dominantColors:
          type: array
          items:
            type: string
        motifs:
          type: array
          items:
            type: string
        bookValue:
          type:
            - number
            - "null"
        bookValueSource:
          type:
